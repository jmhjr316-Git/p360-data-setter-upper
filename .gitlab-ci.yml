stages:
  - build
  - release

build-windows:
  stage: build
  tags:
    - windows
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pyinstaller
    - pyinstaller --onefile --windowed --name "PMSI_Data_Manager" --add-data "templates;templates" --add-data "environment_config.json;." pmsi_data_ui_modern.py
  artifacts:
    paths:
      - dist/PMSI_Data_Manager.exe
    expire_in: 1 week
  only:
    - tags
    - main
    - feature/multi-rx-support

build-macos:
  stage: build
  tags:
    - macos
  script:
    - python3 -m pip install --upgrade pip
    - pip3 install -r requirements.txt
    - pip3 install pyinstaller
    - pyinstaller --onefile --windowed --name "PMSI_Data_Manager" --add-data "templates:templates" --add-data "environment_config.json:." pmsi_data_ui_modern.py
    - mkdir -p dist/dmg
    - cp -r dist/PMSI_Data_Manager.app dist/dmg/
    - hdiutil create -volname "PMSI Data Manager" -srcfolder dist/dmg -ov -format UDZO dist/PMSI_Data_Manager.dmg
  artifacts:
    paths:
      - dist/PMSI_Data_Manager.dmg
    expire_in: 1 week
  only:
    - tags
    - main
    - feature/multi-rx-support

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release"
  release:
    tag_name: $CI_COMMIT_TAG
    description: 'Release $CI_COMMIT_TAG'
    assets:
      links:
        - name: 'Windows Executable'
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/PMSI_Data_Manager.exe?job=build-windows'
        - name: 'macOS DMG'
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/PMSI_Data_Manager.dmg?job=build-macos'
  only:
    - tags
